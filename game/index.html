<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203b49">
  <meta name="description" content="Double Take: find 16 tiny surprises across three original illustrated worlds.">
  <title>Double Take — Spot the Difference</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #203b49; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #game:focus-visible { outline: 3px solid #f9c65d; outline-offset: -3px; }
    #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Double Take. Find differences by clicking either picture. Enter or Space starts and advances. R restarts the run." aria-describedby="status">Double Take requires a browser with canvas support.</canvas>
  <p id="status" role="status" aria-live="polite">Double Take. Press Enter or Space to begin.</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
